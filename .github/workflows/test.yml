name: Run all D Tests

# Only triggers on pushes/PRs to master
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - github_actions

jobs:
    test:
        name: CI
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                dc: [dmd-latest, ldc-latest]
                arch: [x86_64]
                include:
                  - { os: windows-latest, dc: dmd-2.100.2, arch: x86_64 }
                  - { os: windows-latest, dc: dmd-2.100.2, arch: x86_mscoff }
                  - { os: windows-latest, dc: ldc-1.30.0, arch: x86_64 }
                  - { os: macOS-14, dc: ldc-latest, arch: aarch64 }

        runs-on: ${{matrix.os}}
        steps:
            - uses: actions/checkout@v4

            - name: Install D compiler
              uses: dlang-community/setup-dlang@v2
              with:
                  compiler: ${{matrix.dc}}

            - name: Install SOCKS5 proxy
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y microsocks

            # Protection against the accidental absence of a required
            # executable file. Eliminates the risk of false-negative
            # testing.
            - name: Verify proxy servers installed
              if: runner.os == 'Linux'
              run: command -v microsocks

            - name: Run tests
              env:
                DC: ${{matrix.dc}}
                ARCH: ${{matrix.arch}}
                OS: ${{matrix.os}}
              shell: bash
              run: ./run-ci.sh
